name: Documentation fix
description: Report unclear wording, broken links, missing references, or formatting issues.
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: input
    id: page
    attributes:
      label: Page or section
      description: Link or path to the affected page.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is wrong, unclear, outdated, or missing?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested fix
      description: Describe the change you recommend.
    validations:
      required: false

